name: Tests

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

jobs:
  test:
    name: Run pytest via Docker Compose
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure latest commit is checked out
        run: git pull --ff-only

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no cache, pull fresh base)
        run: docker compose build --pull --no-cache

      - name: Debug – inspect working directory inside container
        run: |
          docker compose run --rm --entrypoint="" tests sh -c "pwd && ls -la"

      - name: Run tests
        run: docker compose up --exit-code-from tests --abort-on-container-exit tests

      - name: Tear down
        if: always()
        run: docker compose down --volumes --remove-orphans
