services:
  redis-server:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10

  tests:
    build:
      context: .
      target: test
    depends_on:
      redis-server:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis-server
      - REDIS_PORT=6379
    command: ["pytest", "tests/", "-vvv", "--tb=short"]
