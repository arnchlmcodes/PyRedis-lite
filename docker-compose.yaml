services:
  redis-server:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  tests:
    build:
      context: .
      target: test
    depends_on:
      redis-server:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis-server
      - REDIS_PORT=6379
    command: ["pytest", "tests/", "-v", "--tb=short"]
